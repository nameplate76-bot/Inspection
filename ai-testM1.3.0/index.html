  <script src="./assets/app-version.js?v=M1.3.17-home-fix1"></script>
  <script>
    (function () {
      var version = window.TTOKTTI_APP_VERSION;
      if (!/^M\d+\.\d+\.\d+$/.test(String(version || ''))) return;
      var headerVersion = document.getElementById('ttHomeVersion');
      var footerVersion = document.getElementById('ttFooterVersion');
