<svg xmlns="http://www.w3.org/2000/svg" width="660" height="680" viewBox="0 0 660 680" role="img" aria-labelledby="title desc">
  <title id="title">똑띠i — 친근한 설비 엔지니어 AI 캐릭터</title>
  <desc id="desc">청록색 발광 얼굴과 안전모를 착용한 독창적인 로봇 엔지니어 캐릭터. 가슴에 똑띠i 이름과 설비 점검 마크가 있다.</desc>
  <defs>
    <linearGradient id="body" x1=".08" y1="0" x2=".88" y2="1"><stop stop-color="#3BCDE1"/><stop offset=".43" stop-color="#1486B9"/><stop offset="1" stop-color="#123F79"/></linearGradient>
    <linearGradient id="helmet" x1="0" y1="0" x2=".91" y2="1"><stop stop-color="#E6FCFF"/><stop offset=".55" stop-color="#C6E9FA"/><stop offset="1" stop-color="#85C5E4"/></linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#143A64"/><stop offset="1" stop-color="#041B3A"/></linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#113F68"/><stop offset="1" stop-color="#0B2D51"/></linearGradient>
    <radialGradient id="aura"><stop stop-color="#58E1F1" stop-opacity=".65"/><stop offset="1" stop-color="#3DA4FF" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-.5" y="-.5" width="2" height="2"><feDropShadow dx="0" dy="19" stdDeviation="16" flood-color="#021129" flood-opacity=".38"/></filter>
    <filter id="glow" x="-.6" y="-.6" width="2.2" height="2.2"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <circle cx="332" cy="323" r="288" fill="url(#aura)" opacity=".78"/>
